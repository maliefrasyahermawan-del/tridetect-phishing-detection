[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tridetect"
version = "1.0.0"
description = "Tri-vector Phishing Detection System - Web, Smishing, Vishing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MBC Telkom University Lab" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "tldextract>=5.0",
    "transformers>=4.38",
    "torch>=2.1",
    "python-Levenshtein>=0.25",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "streamlit>=1.30",
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
vishing = [
    "openai-whisper>=20231117",
    "soundfile>=0.12",
    "librosa>=0.10",
]

[project.scripts]
tridetect = "tridetect.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tridetect*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
